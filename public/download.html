<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Your Photo</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        img { max-width: 100%; max-height: 70vh; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); margin-bottom: 15px; display: none; }
        .instructions { font-size: 1.1em; color: #00ff88; margin-bottom: 20px; display: none; font-weight: bold; background: #1e1e1e; padding: 12px 20px; border-radius: 8px; border: 1px solid #333; }
        .btn { display: none; background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; text-decoration: none; padding: 12px 25px; font-size: 1em; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 15px rgba(255,117,140,0.4); }
        #status { font-size: 1.2em; color: #aaa; }
        .expired { color: #ff4444 !important; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="status">✨ Loading your masterpiece...</h1>
    <div id="instructions" class="instructions">📱 Press and hold the photo below to save it to your phone!</div>
    
    <img id="photo-display" alt="Booth Photo">
    
    <a id="download-btn" class="btn" href="#" download="friendship-photo.jpg">💾 Download Image File</a>

    <script>
        const pathParts = window.location.pathname.split('/');
        const imageId = pathParts[pathParts.length - 1];

        async function fetchImage() {
            try {
                const res = await fetch(`/api/image/${imageId}`);
                if (!res.ok) throw new Error('Expired');
                
                const data = await res.json();
                
                const imgElement = document.getElementById('photo-display');
                imgElement.src = data.image;
                imgElement.style.display = 'block';

                document.getElementById('instructions').style.display = 'block';

                const btn = document.getElementById('download-btn');
                btn.href = data.image;
                btn.style.display = 'inline-block';

                document.getElementById('status').style.display = 'none';
            } catch (err) {
                const status = document.getElementById('status');
                status.innerText = "⚠️ This photo has expired and safely self-destructed!";
                status.classList.add('expired');
            }
        }

        fetchImage();
    </script>
</body>
</html>
