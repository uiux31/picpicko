<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Friendship Day Photo Booth ✨</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>✨ Friendship Day Booth ✨</h1>
            <p id="quote-box">"A real friend is one who walks in when the rest of the world walks out."</p>
        </header>
        
        <div class="viewport-wrapper">
            <div class="viewport" id="viewport">
                <video id="webcam" autoplay playsinline></video>
                <img src="logo.jpg" id="watermark-overlay" alt="Watermark">
                <div id="flash-overlay"></div>
                <div id="countdown-display"></div>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="action-bar">
                <button class="flip-btn" onclick="switchCamera()">🔄 Flip Camera</button>
            </div>

            <div class="filters-scroll" id="filters">
                <button onclick="setFilter('none', this)" class="active">📸 Normal</button>
                <button onclick="setFilter('contrast(1.2) saturate(1.6) brightness(1.1) sepia(0.1)', this)">💖 Besties Pop</button>
                <button onclick="setFilter('sepia(0.4) saturate(1.5) contrast(1.1) brightness(1.15)', this)">☀️ Sunny Memories</button>
                <button onclick="setFilter('contrast(1.3) saturate(1.8) hue-rotate(-10deg)', this)">🎉 Party Vibes</button>
                <button onclick="setFilter('brightness(1.15) contrast(0.9) saturate(1.1) blur(0.2px)', this)">☁️ Dreamy Soft</button>
                <button onclick="setFilter('saturate(2) contrast(1.1) hue-rotate(15deg)', this)">🌈 Friendship Burst</button>
                <button onclick="setFilter('saturate(1.7) contrast(1.15) brightness(1.05) hue-rotate(-20deg)', this)">🍭 Candy Colors</button>
                <button onclick="setFilter('brightness(1.1) contrast(1.1) saturate(1.3)', this)">✨ Glow Up</button>
                <button onclick="setFilter('sepia(0.3) contrast(1.2) brightness(1.05) saturate(1.2)', this)">🌅 Golden Sunset</button>
                <button onclick="setFilter('contrast(1.4) brightness(0.9) sepia(0.25) grayscale(0.2)', this)">🎞️ Retro Film</button>
            </div>
        </div>

        <button class="capture-btn" onclick="startCountdownAndCapture()">📷 Snap Photo</button>

        <div id="qr-container">
            <h3>Scan to Download</h3>
            <p>⏳ Disappears in 60 seconds!</p>
            <canvas id="qrcode"></canvas>
        </div>
    </div>

    <audio id="shutter-sound" src="shutter.mp3" preload="auto"></audio>

    <!-- Cache buster appended to ensure old frame code is deleted from phone memory -->
    <script src="script.js?v=3"></script>
</body>
</html>
