<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Friendship Day Booth ✨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 800px; width: 100%; }
        
       h1 { margin: 0; font-size: 2.2em; background: -webkit-linear-gradient(#ff7eb3, #ff758c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .viewport { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4/3; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(255, 117, 140, 0.2); border: 2px solid #222; }
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s ease; }
        
        /* Live watermark overlay for the video feed */
        #watermark-overlay { position: absolute; bottom: 15px; right: 15px; width: 100px; mix-blend-mode: screen; opacity: 0.9; z-index: 10; pointer-events: none; }

        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        button { background: #222; color: white; border: 1px solid #444; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.9em; }
        button:hover { background: #444; border-color: #666; }
        button.active { background: #ff758c; color: #fff; border-color: #ff7eb3; box-shadow: 0 0 10px rgba(255, 117, 140, 0.5); }
        
        button.capture { background: #fff; color: #000; font-size: 1.2em; padding: 15px 35px; border-radius: 30px; margin-top: 10px; border: none; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3); }
        button.capture:hover { transform: scale(1.05); background: #f0f0f0; }
        
        #qr-container { display: none; flex-direction: column; align-items: center; background: white; color: black; padding: 25px; border-radius: 16px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #qr-container h3 { margin: 0 0 8px 0; font-size: 1.4em; }
        #qr-container p { margin: 0 0 15px 0; font-size: 0.9em; color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Friendship Day Booth ✨</h1>
        
        <div class="viewport">
            <video id="webcam" autoplay playsinline></video>
            <!-- Linked to your exact logo.jpg file -->
            <img src="logo.jpg" id="watermark-overlay" alt="Watermark">
        </div>

        <div class="controls" id="filters">
            <button onclick="setFilter('none', this)" class="active">📸 Normal</button>
            <button onclick="setFilter('sepia(0.4) saturate(1.5) contrast(1.1) brightness(1.1)', this)">🌅 Golden Hour</button>
            <button onclick="setFilter('sepia(0.2) contrast(1.2) saturate(1.2) hue-rotate(-10deg) brightness(0.95)', this)">📟 Y2K Film</button>
            <button onclick="setFilter('brightness(1.1) contrast(0.9) saturate(1.2) sepia(0.1)', this)">✨ Soft Angel</button>
            <button onclick="setFilter('contrast(1.2) brightness(0.85) saturate(1.1)', this)">🦇 Moody</button>
            <button onclick="setFilter('grayscale(1) contrast(1.3) brightness(0.9)', this)">🎞️ B&W Retro</button>
        </div>

        <button class="capture" onclick="takePhoto()">📷 Snap Photo</button>

        <div id="qr-container">
            <h3>Scan to Download</h3>
            <p>⏳ Disappears in 60 seconds!</p>
            <canvas id="qrcode"></canvas>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        let currentFilter = 'none';

        // Force load the logo into memory immediately
        const stampLogo = new Image();
        stampLogo.src = 'logo.jpg'; 

        // Start Webcam
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 } })
            .then(stream => video.srcObject = stream)
            .catch(err => alert("Camera access denied."));

        function setFilter(filterString, btn) {
            currentFilter = filterString;
            video.style.filter = filterString;
            document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function takePhoto() {
            const captureBtn = document.querySelector('.capture');
            captureBtn.innerText = "Processing...";
            captureBtn.disabled = true;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');

                // Draw filtered video
                ctx.filter = currentFilter;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.filter = 'none'; // reset filter
                
                // Bulletproof stamping check
                if (stampLogo.complete && stampLogo.naturalWidth !== 0) {
                    ctx.globalCompositeOperation = 'screen'; 
                    
                    const wmWidth = canvas.width * 0.25; 
                    const wmHeight = (stampLogo.naturalHeight / stampLogo.naturalWidth) * wmWidth;
                    const padding = canvas.width * 0.04;
                    
                    ctx.drawImage(stampLogo, canvas.width - wmWidth - padding, canvas.height - wmHeight - padding, wmWidth, wmHeight);
                    
                    ctx.globalCompositeOperation = 'source-over'; 
                } else {
                    console.error("⚠️ Logo failed to load! Check file name and folder placement.");
                }

                // Convert to Base64
                const base64Data = canvas.toDataURL('image/jpeg', 0.9);

                // Upload to server
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Data })
                });
                
                if (!res.ok) throw new Error("Server error.");
                
                const data = await res.json();
                
                // Show QR
                const qrContainer = document.getElementById('qr-container');
                const qrCanvas = document.getElementById('qrcode');
                qrContainer.style.display = 'flex';
                
                QRCode.toCanvas(qrCanvas, data.downloadUrl, { width: 220, margin: 2 }, (error) => {
                    if (error) console.error("QR Error:", error);
                });

                captureBtn.innerText = "📷 Snap Another";
            } catch (err) {
                console.error(err);
                alert("Upload failed.");
                captureBtn.innerText = "📷 Snap Photo";
            }
            captureBtn.disabled = false;
        }
    </script>
</body>
</html>
