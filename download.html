<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Your Photo</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        
        img { max-width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; display: none; }
        
        .instructions { font-size: 1.2em; color: #00ff88; margin-bottom: 20px; display: none; font-weight: bold; background: #222; padding: 10px 20px; border-radius: 8px; }
        
        .btn { display: none; background: #333; color: white; text-decoration: none; padding: 12px 25px; font-size: 1em; border-radius: 8px; border: 1px solid #555; }
        
        #status { font-size: 1.2em; color: #ccc; }
        .expired { color: #ff4444 !important; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="status">Fetching your photo...</h1>
    
    <!-- Bold instructions for the mobile user -->
    <div id="instructions" class="instructions">👇 Press and hold the photo to save it!</div>
    
    <img id="photo-display" alt="Your Booth Photo">
    
    <!-- Backup button just in case they open it in normal Chrome -->
    <a id="download-btn" class="btn" href="#" download="booth-photo.jpg">Or tap here to download</a>

    <script>
        const pathParts = window.location.pathname.split('/');
        const imageId = pathParts[pathParts.length - 1];

        async function fetchImage() {
            try {
                const res = await fetch(`/api/image/${imageId}`);
                if (!res.ok) throw new Error('Expired');
                
                const data = await res.json();
                
                // Show Image & Instructions
                const imgElement = document.getElementById('photo-display');
                imgElement.src = data.image;
                imgElement.style.display = 'block';

                document.getElementById('instructions').style.display = 'block';

                // Setup Backup Download Button
                const btn = document.getElementById('download-btn');
                btn.href = data.image;
                btn.style.display = 'inline-block';

                document.getElementById('status').style.display = 'none';
            } catch (err) {
                const status = document.getElementById('status');
                status.innerText = "⚠️ Photo has expired and been deleted.";
                status.classList.add('expired');
            }
        }

        fetchImage();
    </script>
</body>
</html>
